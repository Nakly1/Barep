name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Barep.csproj

      - name: Build (Release)
        run: dotnet build Barep.csproj -c Release --no-restore

      # Un solo Barep.exe autocontenido: no hace falta instalar .NET para usarlo.
      - name: Publish (win-x64, un solo exe)
        run: dotnet publish Barep.csproj -c Release -r win-x64 -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Barep-${{ github.sha }}
          path: publish/Barep.exe
          retention-days: 7

      # Texto de la versión: cómo descargarla y las novedades de esa versión del CHANGELOG.
      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $text = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $pattern = '(?ms)^## \[' + [regex]::Escape($version) + '\][^\n]*\n(.*?)(?=^## \[|\z)'
          $match = [regex]::Match($text, $pattern)
          $changes = if ($match.Success) { $match.Groups[1].Value.Trim() } else { '' }
          $intro = @(
            '**Descarga `Barep.exe` aquí abajo y ábrelo con doble clic.** No hace falta instalar nada, ni siquiera .NET.',
            '',
            'Si Windows muestra «Windows protegió tu PC», pulsa **Más información → Ejecutar de todas formas** (pasa con cualquier programa nuevo que no está firmado).',
            ''
          ) -join "`n"
          Set-Content -Path release-notes.md -Value ($intro + "`n" + $changes) -Encoding utf8

      # Al subir una etiqueta vX.Y.Z se crea la versión en «Releases» con el exe.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Barep ${{ github.ref_name }}
          body_path: release-notes.md
          files: publish/Barep.exe
