name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Barep.csproj

      - name: Build (Release)
        run: dotnet build Barep.csproj -c Release --no-restore

      # Un solo Barep.exe autocontenido: no hace falta instalar .NET para usarlo.
      - name: Publish (win-x64, un solo exe)
        run: dotnet publish Barep.csproj -c Release -r win-x64 -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Barep-${{ github.sha }}
          path: publish/Barep.exe
          retention-days: 7

      # Al subir una etiqueta vX.Y.Z se crea la versión en «Releases» con el exe.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/Barep.exe
          generate_release_notes: true
